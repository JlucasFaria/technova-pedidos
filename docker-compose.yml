# Ambiente completo da aplicacao TechNova Pedidos.
# Sobe a API e o banco de dados PostgreSQL com as tabelas ja criadas.
# Uso: cp .env.example .env && docker compose up -d --build
#
# As credenciais do banco vem do arquivo .env, que nao e versionado. Os
# valores apos ":-" sao apenas o padrao de desenvolvimento, para que o
# ambiente suba sem configuracao previa - em producao, o .env e obrigatorio.

services:
  api:
    build: .
    image: technova-pedidos:${APP_VERSION:-1.0.0}
    container_name: technova-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DATABASE_URL: postgres://${POSTGRES_USER:-technova}:${POSTGRES_PASSWORD:-technova123}@db:5432/${POSTGRES_DB:-pedidos}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - technova-net

  db:
    image: postgres:16-alpine
    container_name: technova-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-technova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-technova123}
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # O "$$" impede que o Compose interpole aqui: quem expande as variaveis
      # e o shell dentro do container, que ja as recebe pelo environment.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technova-net

volumes:
  dados-postgres:

networks:
  technova-net:
    driver: bridge
