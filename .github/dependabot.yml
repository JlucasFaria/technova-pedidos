# Atualizacao automatica de dependencias.
#
# Antes, uma dependencia com falha de seguranca so seria descoberta por acaso.
# O Dependabot verifica semanalmente e abre um Pull Request com a atualizacao,
# que passa pelo mesmo pipeline de validacao de qualquer outra mudanca.

version: 2
updates:
  # Dependencias da aplicacao (npm)
  - package-ecosystem: npm
    directory: /
    target-branch: desenvolvimento
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencias
    commit-message:
      prefix: chore(deps)

  # Actions utilizadas pelo pipeline
  - package-ecosystem: github-actions
    directory: /
    target-branch: desenvolvimento
    schedule:
      interval: weekly
      day: monday
    labels:
      - ci-cd
    commit-message:
      prefix: ci(actions)

  # Imagem base utilizada no Dockerfile
  - package-ecosystem: docker
    directory: /
    target-branch: desenvolvimento
    schedule:
      interval: weekly
      day: monday
    labels:
      - docker
    commit-message:
      prefix: chore(docker)
