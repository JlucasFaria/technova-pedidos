# Ambiente completo da aplicacao TechNova Pedidos.
# Sobe a API e o banco de dados PostgreSQL com as tabelas ja criadas.
# Uso: docker compose up -d --build

services:
  api:
    build: .
    image: technova-pedidos:1.0.0
    container_name: technova-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      APP_VERSION: 1.0.0
      DATABASE_URL: postgres://technova:technova123@db:5432/pedidos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - technova-net

  db:
    image: postgres:16-alpine
    container_name: technova-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: technova
      POSTGRES_PASSWORD: technova123
      POSTGRES_DB: pedidos
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technova -d pedidos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - technova-net

volumes:
  dados-postgres:

networks:
  technova-net:
    driver: bridge
